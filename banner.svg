<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="280">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="wave2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#textGrad);
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 21px;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .badge-text {
      font-family: 'Fira Code', monospace, Consolas, sans-serif;
      font-size: 13px;
      fill: #38bdf8;
      font-weight: 600;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="280" rx="16" fill="url(#bgGradient)" stroke="#30363d" stroke-width="1.5" />

  <!-- Animated Waves -->
  <path fill="url(#wave1)">
    <animate attributeName="d" dur="10s" repeatCount="indefinite"
      values="
        M 0 170 C 300 230, 600 130, 900 210 C 1050 250, 1150 180, 1200 190 L 1200 280 L 0 280 Z;
        M 0 190 C 300 150, 600 220, 900 160 C 1050 200, 1150 230, 1200 210 L 1200 280 L 0 280 Z;
        M 0 170 C 300 230, 600 130, 900 210 C 1050 250, 1150 180, 1200 190 L 1200 280 L 0 280 Z
      " />
  </path>

  <path fill="url(#wave2)">
    <animate attributeName="d" dur="14s" repeatCount="indefinite"
      values="
        M 0 210 C 250 160, 550 240, 850 180 C 1020 140, 1120 220, 1200 200 L 1200 280 L 0 280 Z;
        M 0 180 C 250 230, 550 160, 850 220 C 1020 250, 1120 170, 1200 190 L 1200 280 L 0 280 Z;
        M 0 210 C 250 160, 550 240, 850 180 C 1020 140, 1120 220, 1200 200 L 1200 280 L 0 280 Z
      " />
  </path>

  <!-- Content -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <!-- Top Pill -->
    <rect x="-130" y="-35" width="260" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="0" y="-17" text-anchor="middle" class="badge-text">⚡ WELCOME TO MY PROFILE</text>

    <!-- Main Title -->
    <text x="0" y="35" class="title" filter="url(#glow)">Hi there, I'm Talha Nizam 👋</text>

    <!-- Subtitle -->
    <text x="0" y="75" class="subtitle">Full Stack &amp; CMS Developer | Web Architect</text>
  </g>
</svg>
